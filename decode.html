<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>Decode sudoku formats</title>
    <script type="module">
      import { decodeSudoku } from './lib/index.mjs'

      document.getElementById('decode').addEventListener('click', (e) => {
        const inputValue = document.getElementById('input').value
        decodeSudoku(inputValue).then((result) => {
          document.getElementById('output').value = JSON.stringify(result, null, 2)
        })
      })
    </script>
  </head>
  <body style="padding-right: 10px; display: flex; flex-direction: column; gap: 10px;">
    <a href="./index.html">Back</a>

    <h1>Decode</h1>

    <div>
      <label for="input">Input</label>
      <input type="text" id="input" style="width: 100%" />
    </div>

    <button id="decode">Decode</button>

    <div>
      <label for="output">Result</label>
      <textarea id="output" style="width: 100%; min-height: 400px" readonly></textarea>
    </div>
  </body>
</html>
